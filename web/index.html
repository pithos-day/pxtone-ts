<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pxtone-ts 再生テスト</title>
  <style>
    body {
      margin: 0;
      background: #1a1d24;
      color: #e8e8e8;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    p.desc {
      color: #9aa;
      font-size: 13px;
      margin: 0 0 16px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    button {
      background: #2a3040;
      color: #e8e8e8;
      border: 1px solid #3a4155;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #343c50;
    }
    button.primary {
      background: #2f6fdb;
      border-color: #2f6fdb;
    }
    button.primary:hover {
      background: #3a7de8;
    }
    #song-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    #status {
      color: #9aa;
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }
    canvas {
      width: 100%;
      height: 140px;
      background: #111;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      margin-bottom: 8px;
    }
    #time {
      font-variant-numeric: tabular-nums;
      color: #9aa;
      font-size: 13px;
    }
    input[type="file"] {
      color: #9aa;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>pxtone-ts 再生テスト</h1>
    <p class="desc">pxtone collage の ptcop ファイルを TypeScript 移植エンジンでレンダリングして再生します。波形クリックでシーク。</p>

    <div class="controls">
      <button id="btn-sample" class="primary">サンプル曲を読み込む</button>
      <button id="btn-play">▶ 再生</button>
      <button id="btn-stop">⏹ 停止</button>
      <input type="file" id="file" accept=".ptcop" />
    </div>

    <div id="song-title">（未読み込み）</div>
    <div id="status">サンプル曲を読み込むか、ptcop ファイルを選択してください。</div>

    <canvas id="wave" width="860" height="140"></canvas>
    <div id="time">0:00 / 0:00</div>
  </main>
  <script type="module" src="./player.js"></script>
</body>
</html>
